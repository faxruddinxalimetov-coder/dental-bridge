<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>DentBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#10242B;--mute:#4A6068;--line:#DCE6E3;--bd:#C5D3D0;--page:#E4EBE9;--red:#B42318;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font:500 15px/1.45 'Manrope','Helvetica Neue',sans-serif}
#app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:#F3F6F5}
@media (min-width:520px){body{display:grid;place-items:center}#app{width:400px;height:min(860px,100% - 24px);border-radius:28px;box-shadow:0 20px 60px rgba(16,36,43,.25)}}
.scr{display:flex;flex-direction:column;height:100%}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15}
h2{margin:4px 0 0;font-size:17px;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a{color:var(--nv);cursor:pointer}
.hd{position:relative;padding:20px 16px 8px}.hd.t{padding:0 16px 8px}
.m{color:var(--mute)}.hd .m{font-size:13px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lng{position:absolute;top:14px;right:16px;min-height:44px;min-width:52px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
.bk{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font-weight:700;text-decoration:none;color:var(--ink)}
.bd{flex:1;min-height:0;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.bd>*{flex:none}
.ft{padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.c[data-go]{cursor:pointer}
.b{width:100%;min-height:52px;border:0;border-radius:12px;color:#fff;background:var(--acc);font-weight:700;font-size:16px;cursor:pointer}
.b.o{background:#fff;color:var(--ink);border:1px solid var(--bd)}
.b.sm{min-height:44px;font-size:14px;flex:1}
.b.red{background:#fff;color:var(--red);border:1px solid #E7B4AE}
.i{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--ink)}
textarea.i{padding:10px 12px;resize:none}
.l{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.s{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.s1{background:#DCEBFA;color:#12365F}.s2{background:#FBE9C8;color:#5E3704}.s3{background:#D3EFEA;color:#0B4B45}.s4{background:#E3E8EA;color:#2B3B41}.s5{background:#FADCD8;color:#7A1A10}
.u{border:1px dashed #9DB5B0;border-radius:12px;padding:14px;color:var(--mute);text-align:center;font-weight:600;cursor:pointer;background:transparent;width:100%}
.sub{color:var(--mute);font-size:13px}
.col{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;gap:8px}.fl>*{flex:1;min-width:0}
.fr{display:flex;justify-content:space-between;align-items:center;min-height:34px;gap:10px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:10px}
nav a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;margin-top:-1px;padding:0 2px;border-top:3px solid transparent;font-size:12px;line-height:1.2;text-decoration:none;font-weight:600;color:var(--mute)}
nav a.on{border-top-color:var(--nv);font-weight:800;color:var(--nv)}
.rb{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer}
.av{flex:0 0 46px;height:46px;border-radius:23px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;font-style:normal;background:var(--acc)}
.hero{position:relative;background:var(--acc);color:#fff;border-radius:20px;padding:20px;overflow:hidden}
.hero .b{margin-top:14px;width:auto;min-height:46px;padding:0 20px;font-size:15px;background:#fff;color:var(--nv)}
.hero .k{font-size:13px;font-weight:600;opacity:.88}.hero .n{font-size:42px;font-weight:800;line-height:1.1}
.tile{min-height:76px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;cursor:pointer}
.tile b{display:block;font-size:14px}.tile span{font-size:12px}
.ph{display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-weight:700;color:#2B3B41}
.steps{display:flex;gap:8px;padding:0 16px 8px}.steps div{flex:1;font-size:12px;font-weight:700;color:var(--mute)}
.steps div.on{color:var(--ink)}.steps i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:4px}.steps .on i{background:var(--acc)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);border:1px solid var(--bd);cursor:pointer}
.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.tabs{display:flex;gap:8px;padding:0 16px 8px}
.tabs button{flex:1;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bub{max-width:80%;padding:10px 12px}
.tg{position:absolute;left:12px;right:12px;bottom:84px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;text-align:center;z-index:9}
.link{display:inline-flex;align-items:center;min-height:36px;font-size:14px;font-weight:700;text-decoration:none}
.site{display:none}@media (min-width:520px){.site{display:block;position:fixed;top:16px;left:20px;font-weight:700;text-decoration:none;color:#10242B;min-height:44px;line-height:44px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.kpi .m{font-size:12px;font-weight:600}.kpi b{display:block;font-size:19px;font-weight:800;margin-top:2px;word-break:break-word}
.kpi[data-go]{cursor:pointer}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec b{font-size:17px;font-weight:800}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-top:1px solid #E6EEEC;color:var(--ink);text-decoration:none;font-weight:600}
.li:first-child{border-top:0}
.li .sub{font-weight:500}
.x{border:0;background:none;color:var(--red);font-weight:800;font-size:18px;min-width:40px;min-height:40px;cursor:pointer;border-radius:10px}
.stg{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #E6EEEC}
.stg:first-child{border-top:0;padding-top:2px}
.dot{width:14px;height:14px;border-radius:7px;margin-top:4px;flex:none;border:2px solid var(--bd);background:#fff}
.dot.work{background:#E0A526;border-color:#E0A526}.dot.done{background:#0B8F7F;border-color:#0B8F7F}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid #E6EEEC}
.tbl th{font-size:12px;color:var(--mute);font-weight:700;background:#FAFCFB}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:#fff}
.tbl th:first-child{background:#FAFCFB}
.tbl tr.tot td{font-weight:800;background:#F6F9F8}
.tbl tr.tot td:first-child{background:#F6F9F8}
.neg{color:var(--red)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.dn{display:flex;gap:8px;align-items:center}
.dn button{flex:0 0 48px;min-height:48px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:800;font-size:18px;cursor:pointer}
</style>
</head>

<script>
/* ============ Konstantalar ============ */
const KEY='dentbridge_v3';
const A={zak:'#0B6B62',tex:'#2456C9',kas:'#8A5A12',adm:'#6B3FA0'};
const BG={zak:'#F3F6F5',tex:'#F1F4FB',kas:'#F8F4EC',adm:'#F5F1FA'};
const NV={zak:'#0B5E57',tex:'#1D44A3',kas:'#74490A',adm:'#5A3289'};
const ROLE={zak:'Zakazchik',tex:'Texnik',kas:'Kassir',adm:'Rahbar'};
// Zubtexnik laboratoriyasi kasblari: har bir naryad bosqichi shu kasblardan biriga tegishli
const PROF={gips:'Gipschi (model)',cad:'CAD modeler (exocad)',cam:'CAM operator / frezerchi',kar:'Karkas texnigi',quy:'Quyuvchi (litey)',ker:'Keramist',imp:'Implant texnigi',pro:'Olinadigan protez texnigi',ort:'Ortodontik texnik',par:'Pardozchi (polirovka)',kur:'Kuryer'};
const PSH={gips:'Gips model',cad:'CAD modellash',cam:'Frezerlash',kar:'Karkas',quy:'Quyish',ker:'Keramika',imp:'Implant qismi',pro:'Protez',ort:'Ortodontiya',par:'Pardoz',kur:'Yetkazish'};
const OST={new:['Yangi','s1'],work:['Jarayonda','s2'],ready:['Tayyor','s3'],del:['Topshirildi','s4']};
const USTAT={ok:['Faol','s3'],pending:['Kutilmoqda','s2'],rejected:['Rad etilgan','s5'],blocked:['Bloklangan','s5']};

/* ============ Yordamchilar ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU');
const som=n=>fmt(n)+" so'm";
const mb=n=>(n/1048576).toFixed(1)+' MB';
const MON=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const monName=ym=>{const [y,m]=ym.split('-');return MON[+m-1]+' '+y};
const dayName=iso=>{const [y,m,d]=iso.split('-');return `${+d} ${MON[+m-1]} ${y}`};
const teethCount=s=>(String(s||'').match(/\d+/g)||[]).length;
let _rnd=7;const rnd=()=>(_rnd=(_rnd*16807)%2147483647)/2147483647;

/* ============ Demo baza ============ */
function seed(){
  const t=today(),dd=n=>addDays(t,n);
  const people=[
    {id:1,kind:'adm',n:'Jasur Karimov',phone:'+998 90 111 22 33',st:'ok'},
    {id:2,kind:'kas',n:'Malika',phone:'+998 91 222 33 44',st:'ok'},
    {id:10,kind:'zak',sub:'Shifokor',n:'Dr. Akmal Rasulov',phone:'+998 90 123 00 01',city:'Urganch',pct:0,disc:0,st:'ok'},
    {id:11,kind:'zak',sub:'Klinika',n:'"Tabassum" klinikasi',phone:'+998 62 224 00 02',city:'Xiva',pct:0,disc:5,st:'ok'},
    {id:12,kind:'zak',sub:'Shifokor',n:'Dr. Nodira Yusupova',phone:'+998 93 555 00 03',city:'Urganch',pct:0,disc:0,st:'ok'},
    {id:20,kind:'tex',prof:'cad',n:'Aziz',phone:'+998 90 123 45 67',exo:'3.2',exp:'4',st:'ok'},
    {id:21,kind:'tex',prof:'cad',n:'Dilnoza',phone:'+998 93 765 43 21',exo:'3.1',exp:'2',st:'pending',test:'test_dilnoza.stl'},
    {id:22,kind:'tex',prof:'gips',n:'Bekzod',phone:'+998 94 100 10 10',exp:'6',st:'ok'},
    {id:23,kind:'tex',prof:'cam',n:'Sanjar',phone:'+998 94 100 10 11',exp:'3',st:'ok'},
    {id:24,kind:'tex',prof:'kar',n:'Rustam',phone:'+998 94 100 10 12',exp:'8',st:'ok'},
    {id:25,kind:'tex',prof:'quy',n:'Sherali',phone:'+998 94 100 10 13',exp:'10',st:'ok'},
    {id:26,kind:'tex',prof:'ker',n:'Laylo',phone:'+998 94 100 10 14',exp:'5',st:'ok'},
    {id:27,kind:'tex',prof:'pro',n:"Ulug'bek",phone:'+998 94 100 10 15',exp:'12',st:'ok'},
    {id:28,kind:'tex',prof:'ort',n:'Kamola',phone:'+998 94 100 10 16',exp:'3',st:'ok'},
    {id:29,kind:'tex',prof:'imp',n:'Otabek',phone:'+998 94 100 10 17',exp:'4',st:'ok'},
    {id:30,kind:'tex',prof:'par',n:'Javohir',phone:'+998 94 100 10 18',exp:'2',st:'ok'},
    {id:31,kind:'tex',prof:'kur',n:'Doniyor',phone:'+998 94 100 10 19',exp:'1',st:'ok'}
  ];
  const price=[
    {id:1,n:'Zirkoniy toj',unit:'birlik',price:450000,st:[['gips',15000],['cad',35000],['cam',40000],['ker',60000]]},
    {id:2,n:'Metallokeramika toj',unit:'birlik',price:300000,st:[['gips',15000],['kar',30000],['quy',20000],['ker',50000]]},
    {id:3,n:'E.max vinir',unit:'birlik',price:500000,st:[['gips',15000],['cad',35000],['cam',40000],['ker',70000]]},
    {id:4,n:'Implant ustidagi toj',unit:'birlik',price:650000,st:[['gips',20000],['imp',50000],['cad',40000],['cam',40000],['ker',60000]]},
    {id:5,n:"Olinadigan protez (to'liq)",unit:"jag'",price:1500000,st:[['gips',30000],['pro',250000],['par',40000]]},
    {id:6,n:'Ortodontik kappa',unit:"jag'",price:400000,st:[['gips',20000],['cad',30000],['ort',80000]]},
    {id:7,n:'Faqat modellash (exocad)',unit:'birlik',price:100000,st:[['cad',35000]]}
  ];
  const staffBy=p=>people.find(x=>x.kind==='tex'&&x.prof===p&&x.st==='ok')?.id||null;
  const mk=(id,zak,pr,teeth,color,due,patient,done,working,created,note)=>{
    const P=price.find(x=>x.id===pr),units=teethCount(teeth)||1,disc=people.find(x=>x.id===zak).disc||0;
    return {id,zak,pr,patient:patient.replace(/^Bemor:\s*/,''),teeth,units,color,due:dd(due),note:note||'',files:[{n:`skan_${id}.stl`,s:2400000}],created:dd(created),del:false,
      sum:Math.round(units*P.price*(1-disc/100)),
      stages:P.st.map(([p,rate],i)=>({p,rate,s:i<done||i===working?staffBy(p):null,st:i<done?'done':i===working?'work':'wait',at:i<done?dd(created+i+1):null})),
      chat:[],seen:{}};
  };
  const orders=[
    mk(1046,12,7,'46, 47','A2',2,'Bemor: Ra\'no S.',0,-1,0),
    mk(1045,10,4,'36','A3',-2,'Bemor: Murod K.',2,2,-6,'Implant: Straumann BL 4.1'),
    mk(1044,12,3,'11, 12, 21, 22','B1',8,'Bemor: Gulnora A.',0,-1,-1,'Yupqa vinir.'),
    mk(1043,11,2,'11','A1',5,'Bemor: Shoxrux D.',1,1,-3),
    mk(1042,10,1,'14, 15, 16','A2',3,'Bemor: Sardor T.',4,-1,-7,'Zirkoniy, 3 birlik.'),
    mk(1040,11,5,"yuqori jag'",'A3',-5,'Bemor: Halima B.',3,-1,-14)
  ];
  const o1040=orders.find(o=>o.id===1040);o1040.units=1;o1040.sum=1425000;o1040.del=true;o1040.delAt=dd(-9);
  orders.find(o=>o.id===1042).chat=[{w:'tex',n:'Aziz',t:"Model tayyor, tishlov tekshirildi."}];
  // Kassa: so'nggi 20 kun. Avvalgi naryadlar topshirilib, to'langan
  const days={},D0=()=>({in:[],adv:[],exp:[],bank:0,oth:[]});_rnd=7;
  for(let i=19;i>=0;i--)days[dd(-i)]=D0();
  const hist=[[1030,10,1,'21'],[1031,12,3,'12, 22'],[1032,11,2,'36, 37'],[1033,10,6,"yuqori jag'"],[1034,12,1,'45'],[1035,11,4,'46'],[1036,10,7,'14, 15, 16, 17'],[1037,12,2,'24, 25'],[1038,11,1,'11, 21'],[1039,10,3,'13']];
  hist.forEach(([id,z,pr,teeth],k)=>{const created=-24+k*2,o=mk(id,z,pr,teeth,'A2',created+7,'',99,-1,created);o.stages.forEach((s,i)=>s.at=dd(Math.min(-1,created+i+1)));
    o.del=true;o.delAt=dd(Math.min(-1,created+8));orders.push(o);
    if(k<9&&days[o.delAt])days[o.delAt].in.push([z,rnd()<.6?'n':'p',o.sum,id])});
  const exps=['Gips va material','Freza diski','Elektr energiya','Keramika massasi',"Terminal qog'ozi",'Yetkazish (taksi)','Internet'];
  Object.keys(days).forEach((d,i)=>{const x=days[d];
    if(rnd()<.6)x.exp.push([exps[Math.floor(rnd()*exps.length)],Math.round(rnd()*8+1)*25000]);
    if(i%5===4)x.adv.push([[22,23,24,26][(i/5|0)%4],300000]);
    if(i%7===6)x.bank=1000000;
    if(i===8)x.oth.push(['Eski apparat sotildi','n',400000]);});
  days[o1040.delAt].in.push([11,'p',1425000,1040]);
  days[dd(-1)].in.push([10,'n',600000,1042]);
  return {v:3,lab:{name:'Smile Dental Lab',city:'Urganch',phone:'+998 90 111 22 33'},notif:true,lang:'uz',kInK:true,next:1047,
    people,price,orders,days,me:{},upd:t};
}

let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||D.v!==3)D=seed();
const S={role:null,screen:'start',sel:null,pid:null,prid:null,flt:'all',pf:'all',draft:{},files:{},kdate:today(),kt:'in',month:today().slice(0,7),imp:null,ix:null,link:false};
function save(){D.upd=today();try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast("Brauzer xotirasi to'ldi: saqlanmadi");return false}}

/* ============ Model funksiyalari ============ */
const P=id=>D.people.find(x=>x.id===id);
const kind=k=>D.people.filter(x=>x.kind===k);
const pname=id=>P(id)?.n||'—';
const PR=id=>D.price.find(x=>x.id===id);
const ord=()=>D.orders.find(o=>o.id===S.sel);
const me=()=>S.role==='adm'?(kind('adm')[0]||{id:0,n:'Rahbar'}):P(D.me[S.role]);
const newId=()=>Math.max(100,...D.people.map(x=>x.id))+1;
const ostat=o=>o.del?'del':o.stages.every(s=>s.st==='done')?'ready':o.stages.some(s=>s.st!=='wait')?'work':'new';
const avail=(o,i)=>!o.del&&o.stages[i].st==='wait'&&o.stages.slice(0,i).every(s=>s.st==='done');
const curStage=o=>o.stages.find(s=>s.st!=='done');
const overdue=o=>!o.del&&o.due<today();
const unread=(o,r)=>o.chat.slice(o.seen[r]||0).filter(m=>m.w!==r).length;
const day=d=>D.days[d]||(D.days[d]={in:[],adv:[],exp:[],bank:0,oth:[]});
const pctOf=(pid,m)=>{const p=P(pid)||{};return m==='p'?(p.pp??p.pct??0):(p.pct??0)};
// To'lovlar indeksi: har render oldidan bir marta quriladi
function ix(){
  if(S.ix)return S.ix;
  const by={},byOrd={};
  for(const d in D.days)for(const e of D.days[d].in){by[e[0]]=(by[e[0]]||0)+e[2];if(e[3])byOrd[e[3]]=(byOrd[e[3]]||0)+e[2]}
  return S.ix={by,byOrd};
}
const billed=pid=>D.orders.filter(o=>o.zak===pid&&['ready','del'].includes(ostat(o))).reduce((a,o)=>a+o.sum,0);
const debt=pid=>billed(pid)-(ix().by[pid]||0);
// Kunlik hisob (Excel'dagi kunlik varaq formulalari bo'yicha)
function calc(dates){
  const r={N:0,P:0,PlN:0,PlP:0,A:0,X:0,B:0,ON:0,OP:0,per:{},days:0};
  for(const d of dates){const x=D.days[d];if(!x)continue;r.days++;
    for(const [pid,m,s] of x.in){const pl=s*pctOf(pid,m),q=r.per[pid]||(r.per[pid]={n:0,p:0,pl:0,a:0});
      if(m==='n'){r.N+=s;r.PlN+=pl;q.n+=s}else{r.P+=s;r.PlP+=pl;q.p+=s}q.pl+=pl;}
    for(const [pid,s] of x.adv){r.A+=s;(r.per[pid]||(r.per[pid]={n:0,p:0,pl:0,a:0})).a+=s}
    for(const e of x.exp)r.X+=e[1];
    r.B+=x.bank||0;
    for(const [,m,s] of x.oth)m==='n'?r.ON+=s:r.OP+=s;
  }
  r.kassa=r.N-r.A-r.X+r.ON;            // Kassada hozirgi summa
  r.zoir=r.N-r.A-r.B-r.X+r.ON;         // Egasiga (Zoir)
  r.foida=r.zoir+r.B+(r.P+r.OP-r.PlP); // Jami foida: naqd + plastik
  r.olin=r.PlN-r.A;                    // Olinmagan pul (ulush - avans)
  return r;
}
const monthDates=ym=>Object.keys(D.days).filter(d=>d.startsWith(ym)).sort();
// Texnik daromadi (ishbay): tugatilgan bosqichlar
function earn(pid,ym){
  const rows={};let sum=0,cnt=0;
  for(const o of D.orders)for(const s of o.stages)if(s.s===pid&&s.st==='done'&&(s.at||'').startsWith(ym)){
    const k=o.zak+'|'+s.rate,r=rows[k]||(rows[k]={zak:o.zak,units:0,rate:s.rate,sum:0});
    r.units+=o.units;r.sum+=o.units*s.rate;sum+=o.units*s.rate;cnt++;
  }
  let paid=0;for(const d of monthDates(ym))for(const [p,s] of D.days[d].adv)if(p===pid)paid+=s;
  return {rows:Object.values(rows),sum,cnt,paid};
}

  <div class="fl" style="gap:12px">${L('Rang',I('o_color','A2'),'flex:1')}${L('Muddat',I('o_due','','date',`min="${today()}"`),'flex:1')}</div>
  ${pickRow('o','Fayllar (skan, rasm, video)',[['Rasm','image/*'],['Video','video/*'],['Fayl','']])}${files('o')}${L('Izoh',TA('o_note'))}
  <div class="c row"><span class="m">Taxminiy summa${z?.disc?` (chegirma ${z.disc}%)`:''}</span><b>${som(sum)}</b></div></div>
  <div class="ft"><button class="b" data-act="create">Naryadni yuborish</button></div>`)},

order:()=>{const o=ord();if(!o)return SC.orders();const r=S.role,u=me(),pr=PR(o.pr),n=unread(o,r),st=ostat(o),paid=ix().byOrd[o.id]||0;
  const ch=`<button class="b o" style="color:var(--nv);border:2px solid var(--nv)" data-go="chat">Chat${n?` · ${n} yangi`:''}</button>`;
  let rows=kv('Ish turi',esc(pr?.n||'—'))+kv('Tishlar',`${esc(o.teeth)} · ${o.units} ${esc(pr?.unit||'')}`)+kv('Rang',esc(o.color||'—'))+kv('Muddat',`<span class="${overdue(o)?'neg':''}">${esc(o.due)}</span>`)+kv('Bemor',esc(o.patient||'—'));
  if(r!=='zak')rows+=kv('Zakazchik',esc(pname(o.zak)));
  if(r!=='tex')rows+=kv('Summa',som(o.sum))+kv("To'langan",som(paid));
  rows+=`<div class="sub" style="margin-top:4px">Izoh: ${esc(o.note||'—')}</div>`;
  const stg=o.stages.map((s,i)=>{const fix=s.fix&&s.st==='work'?`<div class="sub neg">Tuzatish: ${esc(s.fix)}</div>`:'';
    const who=s.s?esc(pname(s.s)):avail(o,i)?'Navbatda':'Kutmoqda';
    let act='';
    if(r==='adm'&&s.st==='done'&&!o.del)act=`<button class="link" style="border:0;background:none;color:var(--red)" data-act="sback" data-i="${i}">Qaytarish</button>`;
    return `<div class="stg"><span class="dot ${s.st}"></span><div style="flex:1;min-width:0"><div class="row"><b style="font-size:14px">${i+1}. ${esc(PSH[s.p])}</b>${r!=='zak'?`<span class="sub">${som(s.rate*o.units)}</span>`:''}</div><div class="sub">${esc(PROF[s.p])} · ${who}${s.at&&s.st==='done'?' · '+esc(s.at):''}${s.file?' · '+esc(s.file):''}</div>${fix}${act}</div></div>`}).join('');
  let mid=`<div class="c"><b style="display:block;margin-bottom:6px">Bosqichlar</b>${stg}</div><button class="b o" data-toast="Demo: fayl serverda saqlanmaydi">Skanni yuklab olish</button>${ch}`,ft='';
  if(r==='tex'){const i=o.stages.findIndex((s,k)=>s.p===u.prof&&(avail(o,k)||(s.s===u.id&&s.st==='work')));
    if(i>=0&&o.stages[i].st==='wait')ft=`<button class="b" data-act="take" data-i="${i}">Bosqichni qabul qilish</button>`;
    else if(i>=0){mid+=`<button class="u" data-pick="w" data-acc="${u.prof==='cad'?'.stl':''}">${S.files.w?.[0]?esc(S.files.w[0].n):u.prof==='cad'?"Exocad'da tayyorlangan modelni yuklash [.stl]":'Natija rasmi yoki fayli (ixtiyoriy)'}</button>${L('Izoh',TA('mn',2))}`;ft=`<button class="b" data-act="sdone" data-i="${i}">Bosqichni topshirish</button>`}}
  if(r==='zak'&&st==='ready'){mid+=L(`Tuzatish sababi (kerak bo'lsa)`,TA('fx',2));ft=`<button class="b" data-act="accept">Qabul qilish</button><button class="b o" data-act="fix">Tuzatishga qaytarish</button>`}
  if((r==='adm'||r==='kas')&&st==='ready')ft=`<button class="b" data-act="deliver">Zakazchikka topshirildi</button>`;
  if((r==='adm'||r==='kas')&&o.sum>paid)ft+=`<button class="b o" data-act="payorder">To'lov qabul qilish</button>`;
  return R(`${back('orders')}<div class="hd t row"><h1>№${o.id}</h1>${badge(o)}</div><div class="bd"><div class="c col" style="gap:0">${rows}</div>${mid}</div>${ft?`<div class="ft">${ft}</div>`:''}`)},

chat:()=>{const o=ord(),r=S.role;
  const msgs=o.chat.map(m=>m.w===r?`<div class="bub" style="align-self:flex-end;background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px">${esc(m.t)}</div>`:`<div class="bub" style="align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px"><div style="font-size:12px;font-weight:700" class="m">${esc(m.n||ROLE[m.w])} · ${ROLE[m.w]}</div>${esc(m.t)}</div>`).join('')||'<div class="sub" style="text-align:center">Xabar yo\'q</div>';
  return R(`${back('order')}<div class="hd t row"><h1 style="font-size:22px">Chat · №${o.id}</h1>${badge(o)}</div><div class="bd" id="msgs" style="gap:10px">${msgs}</div><div style="padding:10px 12px 20px;display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid var(--line)"><button aria-label="Biriktirish" data-pick="c" data-acc="" style="width:44px;height:44px;border:1px solid var(--bd);border-radius:22px;background:#fff;font-size:22px;font-weight:700;cursor:pointer">+</button><input class="i" id="cm" data-f="cm" placeholder="Xabar" aria-label="Xabar" style="flex:1;width:auto;min-width:0"><button aria-label="Yuborish" data-act="send" style="width:44px;height:44px;border:0;border-radius:22px;background:var(--acc);color:#fff;font-size:20px;font-weight:700;cursor:pointer">→</button></div>`)},

jobs:()=>{const u=me(),f=S.flt==='mine'?'mine':S.flt==='done'?'done':'open',list=[];
  for(const o of D.orders)o.stages.forEach((s,i)=>{
    if(f==='open'&&s.p===u.prof&&avail(o,i))list.push([o,s]);
    if(f==='mine'&&s.s===u.id&&s.st==='work')list.push([o,s]);
    if(f==='done'&&s.s===u.id&&s.st==='done')list.push([o,s]);});
  return R(`<div class="hd">${lng}<div class="m">${esc(PROF[u.prof])} · ${esc(u.n)}</div><h1>Ishlar</h1></div><div class="tabs">${[['open','Ochiq'],['mine','Jarayonda'],['done','Topshirilgan']].map(([k,t])=>`<button class="${f===k?'on':''}" data-act="flt" data-k="${k}">${t}</button>`).join('')}</div>
  <div class="bd">${list.map(([o,s])=>ocard(o,`<div class="sub" style="margin-top:4px">${esc(PSH[s.p])} · ${o.units} ${esc(PR(o.pr)?.unit||'')} · <b style="color:var(--ink)">${som(s.rate*o.units)}</b></div>`)).join('')||'<div class="c sub" style="text-align:center">Ish yo\'q</div>'}</div>${nav()}`)},

earn:()=>{const u=me(),ym=S.month,e=earn(u.id,ym);
  return R(`<div class="hd"><div class="m">${esc(u.n)} · ${esc(PROF[u.prof])}</div><h1>Daromad</h1></div><div class="bd">
  ${L('Oy',I('month','','month','data-rr="1"'))}
  <div class="grid2"><div class="kpi"><div class="m">Hisoblandi</div><b>${som(e.sum)}</b></div><div class="kpi"><div class="m">Berildi (avans/oylik)</div><b>${som(e.paid)}</b></div></div>
  <div class="c row"><span class="m">Qoldiq (olinmagan)</span><b class="${e.sum-e.paid<0?'neg':''}">${som(e.sum-e.paid)}</b></div>
  <div class="sec"><b>Zakazchilar bo'yicha</b><span class="sub">${e.cnt} ta bosqich</span></div>
  ${e.rows.length?table(['Zakazchik','Birlik','Narx','Summa'],e.rows.map(r=>[esc(pname(r.zak)),r.units,fmt(r.rate),fmt(r.sum)]),['Jami',e.rows.reduce((a,r)=>a+r.units,0),'',fmt(e.sum)]):'<div class="c sub">Bu oyda topshirilgan bosqich yo\'q</div>'}
  </div>${nav()}`)},

bill:()=>{const u=me(),os=D.orders.filter(o=>o.zak===u.id),pays=[];
  for(const d of Object.keys(D.days).sort().reverse())for(const e of D.days[d].in)if(e[0]===u.id)pays.push([d,e]);
  const b=billed(u.id),p=ix().by[u.id]||0;
  return R(`<div class="hd"><div class="m">${esc(u.n)}</div><h1>Hisob</h1></div><div class="bd">
  <div class="grid2"><div class="kpi"><div class="m">Hisoblangan</div><b>${som(b)}</b></div><div class="kpi"><div class="m">To'langan</div><b>${som(p)}</b></div></div>
  <div class="c row"><span class="m">${b-p>=0?'Qarz':"Ortiqcha to'lov"}</span><b class="${b-p>0?'neg':''}">${som(Math.abs(b-p))}</b></div>
  <div class="sec"><b>Naryadlar</b></div>${table(['Naryad','Holat','Summa',"To'langan"],os.map(o=>[`№${o.id}`,OST[ostat(o)][0],fmt(o.sum),fmt(ix().byOrd[o.id]||0)]))}
  <div class="sec"><b>To'lovlar</b></div><div class="list">${pays.slice(0,30).map(([d,e])=>`<div class="li"><span>${esc(d)}<div class="sub">${e[1]==='n'?'Naqd':'Plastik'}${e[3]?' · №'+e[3]:''}</div></span><b>${som(e[2])}</b></div>`).join('')||'<div class="li sub">To\'lov yo\'q</div>'}</div></div>${nav()}`)},

port:()=>{const f=S.pf,us=kind('tex').filter(x=>x.st==='ok'&&(f==='all'||x.prof===f)),profs=[...new Set(kind('tex').filter(x=>x.st==='ok').map(x=>x.prof))];
  return R(`<div class="hd"><h1>Texniklar</h1><div class="m">Tasdiqlangan laboratoriya xodimlari</div></div><div class="bd"><div class="chips">${[['all','Hammasi'],...profs.map(p=>[p,PSH[p]])].map(([k,t])=>`<button class="chip ${f===k?'on':''}" data-act="pf" data-k="${k}">${esc(t)}</button>`).join('')}</div>${us.map(ptile).join('')||'<div class="c sub">Topilmadi</div>'}</div>${nav()}`)},

/* ---------- Kassa ---------- */
kassa:()=>{const d=S.kdate,x=D.days[d]||{in:[],adv:[],exp:[],bank:0,oth:[]},c=calc([d]);
  const del=(k,i)=>`<button class="x" data-act="kdel" data-k="${k}" data-i="${i}" aria-label="O'chirish">×</button>`;
  const sec=(t,k,items)=>`<div class="sec"><b>${t}</b><button class="link" style="border:0;background:none;color:var(--nv);cursor:pointer" data-act="kadd" data-k="${k}">+ Qo'shish</button></div><div class="list">${items||'<div class="li sub">Yozuv yo\'q</div>'}</div>`;
  return R(`<div class="hd"><div class="m">Kassa · ${esc(D.lab.name)}</div><h1>${esc(dayName(d))}</h1></div><div class="bd">
  <div class="dn"><button data-act="kday" data-k="-1" aria-label="Oldingi kun">‹</button>${I('kdate','','date','data-rr="1" style="flex:1"')}<button data-act="kday" data-k="1" aria-label="Keyingi kun">›</button></div>
  ${sumCard(c)}
  ${sec('Kirim (kim topshirdi)','in',x.in.map((e,i)=>`<div class="li"><span>${esc(pname(e[0]))}<div class="sub">${e[1]==='n'?'Naqd':'Plastik'}${e[3]?' · №'+e[3]:''}${pctOf(e[0],e[1])?` · ulush ${Math.round(pctOf(e[0],e[1])*100)}%`:''}</div></span><span class="dn"><b>${fmt(e[2])}</b>${del('in',i)}</span></div>`).join(''))}
  ${sec('Avans / oylik (oldi)','adv',x.adv.map((e,i)=>`<div class="li"><span>${esc(pname(e[0]))}</span><span class="dn"><b>${fmt(e[1])}</b>${del('adv',i)}</span></div>`).join(''))}
  ${sec('Xarajat (nimaga sarflandi)','exp',x.exp.map((e,i)=>`<div class="li"><span>${esc(e[0])}</span><span class="dn"><b>${fmt(e[1])}</b>${del('exp',i)}</span></div>`).join(''))}
  ${sec('Boshqa kirimlar','oth',x.oth.map((e,i)=>`<div class="li"><span>${esc(e[0])}<div class="sub">${e[1]==='n'?'Naqd':'Plastik'}</div></span><span class="dn"><b>${fmt(e[2])}</b>${del('oth',i)}</span></div>`).join(''))}
  ${sec('Bankka berilgan','bank',x.bank?`<div class="li"><span>Bank</span><span class="dn"><b>${fmt(x.bank)}</b>${del('bank',0)}</span></div>`:'')}
  </div>${nav()}`)},

kform:()=>{const k=S.kt,T={in:'Kirim',adv:'Avans / oylik',exp:'Xarajat',oth:'Boshqa kirim',bank:'Bankka berish'}[k];
  const ppl=D.people.filter(x=>x.kind!=='adm'&&(k==='in'?x.kind==='zak'||x.pct:true));
  const pid=+(S.draft.k_p||ppl[0]?.id),ords=k==='in'?D.orders.filter(o=>o.zak===pid&&o.sum>(ix().byOrd[o.id]||0)):[];
  const grp=k==='adv'?ppl.slice().sort((a,b)=>(a.kind==='tex'?0:1)-(b.kind==='tex'?0:1)):ppl;
  return R(`${back('kassa')}<div class="hd t"><div class="m">${esc(dayName(S.kdate))}</div><h1>${T}</h1></div><div class="bd">
  ${k==='in'||k==='adv'?L(k==='in'?'Kim topshirdi':'Kimga berildi',SEL('k_p',grp.map(x=>[x.id,`${x.n}${x.kind==='tex'?' · '+(PSH[x.prof]||''):x.kind==='kas'?' · kassir':''}`]),'data-rr="1"')):''}
  ${k==='exp'?L('Nimaga sarflandi',I('k_t','Material, oylik, ijara...')):''}
  ${k==='oth'?L('Kim berdi / izoh',I('k_t','Masalan: qarz qaytdi')):''}
  ${k==='in'||k==='oth'?L("To'lov turi",SEL('k_m',[['n','Naqd'],['p','Plastik']])):''}
  ${L(`Summa (${unitHint()})`,I('k_s',D.kInK?'350':'350000','text','inputmode="decimal"'))}
  ${k==='in'&&ords.length?L('Naryad (ixtiyoriy)',SEL('k_o',[['','— Naryadsiz —'],...ords.map(o=>[o.id,`№${o.id} · qoldiq ${som(o.sum-(ix().byOrd[o.id]||0))}`])])):''}
  ${k==='in'&&pid&&pctOf(pid,'n')?`<div class="sub">Bu shaxs ulushi: naqd ${Math.round(pctOf(pid,'n')*100)}%, plastik ${Math.round(pctOf(pid,'p')*100)}% (Plan)</div>`:''}
  <div class="sub">Summalar ${unitHint()}da kiritiladi. Sozlamalarda o'zgartirish mumkin.</div></div>
  <div class="ft"><button class="b" data-act="ksave">Saqlash</button></div>`)},

rep:()=>{const ym=S.month,ds=monthDates(ym),c=calc(ds),y=ym.slice(0,4);
  const months=[...new Set(Object.keys(D.days).filter(d=>d.startsWith(y)).map(d=>d.slice(0,7)))].sort();
  const per=Object.entries(c.per).map(([pid,q])=>[+pid,q]).sort((a,b)=>(b[1].n+b[1].p)-(a[1].n+a[1].p));
  const ords=D.orders.filter(o=>o.created.startsWith(ym)),byPr={};for(const o of ords){const k=PR(o.pr)?.n||'—';(byPr[k]||(byPr[k]={n:0,u:0,s:0}));byPr[k].n++;byPr[k].u+=o.units;byPr[k].s+=o.sum}
  const tex=kind('tex').map(u=>[u,earn(u.id,ym)]).filter(x=>x[1].sum||x[1].paid);
  const exps={};for(const d of ds)for(const [t,s] of D.days[d].exp)exps[t]=(exps[t]||0)+s;
  return R(`<div class="hd"><div class="m">Hisobot</div><h1>${esc(monName(ym))}</h1></div><div class="bd">
  ${L('Oy',I('month','','month','data-rr="1"'))}
  ${sumCard(c,`Oy jami · ${c.days} kun`)}
  <div class="sec"><b>Kunlar bo'yicha</b></div>
  ${ds.length?table(['Kun','Naqd','Plastik','Avans','Xarajat','Bank','Foyda'],ds.map(d=>{const q=calc([d]);return [`<a href="#" data-act="openday" data-k="${d}">${+d.slice(8)}</a>`,fmt(q.N),fmt(q.P),fmt(q.A),fmt(q.X),fmt(q.B),`<span class="${q.foida<0?'neg':''}">${fmt(q.foida)}</span>`]}),['Jami',fmt(c.N),fmt(c.P),fmt(c.A),fmt(c.X),fmt(c.B),fmt(c.foida)]):'<div class="c sub">Bu oyda kassa yozuvi yo\'q</div>'}
  ${per.length?`<div class="sec"><b>Shaxslar bo'yicha (topshirdi)</b></div>${table(['Ism','Naqd','Plastik','Ulush','Avans','Olinmagan'],per.map(([pid,q])=>[esc(pname(pid)),fmt(q.n),fmt(q.p),fmt(q.pl),fmt(q.a),`<span class="${q.pl-q.a<0?'neg':''}">${fmt(q.pl-q.a)}</span>`]))}`:''}
  ${Object.keys(exps).length?`<div class="sec"><b>Xarajatlar</b></div>${table(['Nimaga','Summa'],Object.entries(exps).sort((a,b)=>b[1]-a[1]).map(([t,s])=>[esc(t),fmt(s)]),['Jami',fmt(c.X)])}`:''}
  ${ords.length?`<div class="sec"><b>Naryadlar (ish turi)</b></div>${table(['Ish turi','Soni','Birlik','Summa'],Object.entries(byPr).map(([k,q])=>[esc(k),q.n,q.u,fmt(q.s)]))}`:''}
  ${tex.length?`<div class="sec"><b>Xodimlar ishbay haqi</b></div>${table(['Xodim','Kasb','Hisoblandi','Berildi'],tex.map(([u,e])=>[esc(u.n),esc(PSH[u.prof]),fmt(e.sum),fmt(e.paid)]))}`:''}
  ${months.length>1?`<div class="sec"><b>${y} yil oylari</b></div>${table(['Oy','Naqd','Plastik','Xarajat','Foyda'],months.map(m=>{const q=calc(monthDates(m));return [`<a href="#" data-act="openmonth" data-k="${m}">${MON[+m.slice(5)-1]}</a>`,fmt(q.N),fmt(q.P),fmt(q.X),fmt(q.foida)]}))}`:''}
  </div>${nav()}`)},

/* ---------- Zakazchilar ---------- */

  <div class="list">${list.map(([z,db,has])=>`<a href="#" class="li" data-go="client" data-id="${z.id}"><span>${esc(z.n)}<div class="sub">${esc(z.sub||'')}${z.pct?` · ulush ${Math.round(z.pct*100)}%`:''}${z.imported?' · Excel':''}</div></span><span class="${has&&db>0?'neg':'sub'}" style="font-weight:700">${has?(db>0?som(db):'Qarz yo\'q'):som(ix().by[z.id]||0)}</span></a>`).join('')||'<div class="li sub">Topilmadi</div>'}</div></div>

client:()=>{const z=P(S.pid);if(!z)return SC.clients();const os=D.orders.filter(o=>o.zak===z.id),b=billed(z.id),p=ix().by[z.id]||0;
  return R(`${back('clients')}<div class="hd t"><div class="m">${esc(z.sub||'Zakazchi')}${z.city?' · '+esc(z.city):''}</div><h1>${esc(z.n)}</h1></div><div class="bd">
  <div class="grid2"><div class="kpi"><div class="m">Hisoblangan</div><b>${som(b)}</b></div><div class="kpi"><div class="m">Jami topshirgan</div><b>${som(p)}</b></div></div>
  ${os.length?`<div class="c row"><span class="m">${b-p>=0?'Qarz':"Ortiqcha to'lov"}</span><b class="${b-p>0?'neg':''}">${som(Math.abs(b-p))}</b></div>`:''}
  <div class="c col" style="gap:0">${kv('Telefon',esc(z.phone||'—'))}${kv('Chegirma',(z.disc||0)+'%')}${kv('Ulush (plan)',`naqd ${Math.round((z.pct||0)*100)}% · plastik ${Math.round((z.pp??z.pct??0)*100)}%`)}</div>
  ${S.role==='adm'?`<div class="fl">${L('Chegirma %',I('c_disc',String(z.disc||0),'number','min="0" max="100"'))}${L('Ulush %',I('c_pct',String(Math.round((z.pct||0)*100)),'number','min="0" max="100"'))}</div><button class="b o" data-act="csave">Saqlash</button>`:''}

/* ============ Render va navigatsiya ============ */
function collect(){document.querySelectorAll('[data-f]').forEach(e=>{if(e.type==='radio')return;S.draft[e.dataset.f]=e.type==='checkbox'?e.checked:e.value})}
function render(){S.ix=null;const m0=$('#msgs');
  $('#app').innerHTML=(SC[S.screen]||SC.start)();
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
  const bd=$('.bd');if(bd&&S.keep!=null){bd.scrollTop=S.keep;S.keep=null}}
function go(s,id){collect();
  if(id!=null){if(['order'].includes(s))S.sel=+id;if(['person','client'].includes(s))S.pid=+id;if(s==='pedit')S.prid=+id}
  if(s==='prof')s=S.role==='zak'?'regzak':'regtex';
  if(s==='chat'){const o=ord();o.seen[S.role]=o.chat.length;save()}
  if(s==='regzak'&&S.role==='zak'&&me())Object.assign(S.draft,{z_name:me().n,z_sub:me().sub,z_phone:me().phone,z_city:me().city});
  if(s==='regtex'&&S.role==='tex'&&me())Object.assign(S.draft,{t_name:me().n,t_phone:me().phone,t_prof:me().prof,t_exo:me().exo,t_exp:me().exp});
  if(s==='pedit'){const p=PR(S.prid);if(p){Object.assign(S.draft,{p_n:p.n,p_price:p.price,p_unit:p.unit});p.st.forEach(([,r],i)=>S.draft['p_r'+i]=r)}}
  if(s==='client'&&P(S.pid)){const z=P(S.pid);S.draft.c_disc=z.disc||0;S.draft.c_pct=Math.round((z.pct||0)*100)}
  if(s==='orders'||s==='jobs')S.flt=s==='jobs'?(['open','mine','done'].includes(S.flt)?S.flt:'open'):(['all','new','work','ready','del','late'].includes(S.flt)?S.flt:'all');
  if(s==='staff'||s==='port')S.pf='all';
  if(['kassa','rep','earn','person'].includes(s)){S.draft.kdate=S.kdate;S.draft.month=S.month}
  if(s==='kform')['k_s','k_t','k_o'].forEach(k=>delete S.draft[k]);
  S.screen=s;render()}
function toast(t){const e=document.createElement('div');e.className='tg';e.setAttribute('role','status');e.textContent=t;$('#app').appendChild(e);setTimeout(()=>e.remove(),2600)}
const need=(k,t)=>{if(!String(S.draft[k]??'').trim()){toast(t);return false}return true};
function homeFor(r){if(r==='kas')return 'kassa';if(r==='tex'&&me()?.st!=='ok')return 'regwait';return 'home'}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error("Excel kutubxonasi yuklanmadi. Internetni tekshiring."));document.head.appendChild(s)})}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-pick],[data-toast]');if(!t)return;
  if(t.tagName==='A')e.preventDefault();
  if(t.dataset.toast)return toast(t.dataset.toast);
  if(t.dataset.pick){const f=$('#fp');f.dataset.k=t.dataset.pick;f.accept=t.dataset.acc||'';f.multiple=['o','t'].includes(t.dataset.pick);
    if(t.dataset.pick==='t'&&t.textContent==='Havola'){collect();S.link=true;return render()}
    f.value='';return f.click()}
  if(t.dataset.go)return go(t.dataset.go,t.dataset.id);
  if(t.type==='checkbox')return;
  collect();const a=t.dataset.act,d=S.draft,o=S.sel?ord():null,u=me();
  switch(a){
  case 'role':S.role=t.dataset.k;if(S.role==='adm')return go('home');
    if(D.me[S.role]&&P(D.me[S.role])&&P(D.me[S.role]).st!=='blocked')return go(homeFor(S.role));return go('who');
  case 'pick':{const p=P(+t.dataset.id);if(p.st==='blocked')return toast('Akkaunt bloklangan');D.me[S.role]=p.id;save();return go(homeFor(S.role))}
  case 'logout':S.role=null;return go('start');
  case 'switch':delete D.me[S.role];save();return go('who');
  case 'regzak':{if(!need('z_name','Ismni kiriting'))return;const x={kind:'zak',n:d.z_name.trim(),sub:d.z_sub||'Shifokor',phone:d.z_phone||'',city:d.z_city||'',pct:0,disc:0,st:'ok'};
    if(S.role==='zak'&&me())Object.assign(me(),x);else{x.id=newId();D.people.push(x);D.me.zak=x.id}save();toast('Saqlandi');return go('home')}
  case 'regtex':{if(!need('t_name','Ismni kiriting'))return;if(d.t_prof==='cad'&&!need('t_exo','Exocad versiyasini kiriting'))return;
    if(d.t_prof==='cad')return go('regtest');return saveTex()}
  case 'regtest':if(!S.files.ts?.[0])return toast('Avval .stl modelni yuklang');return saveTex(S.files.ts[0].n);
  case 'edittex':return go('regtex');
  case 'flt':S.flt=t.dataset.k;return render();
  case 'pf':S.pf=t.dataset.k;return render();
  case 'create':{if(!need('o_teeth','Tish raqamlarini kiriting')||!need('o_due','Muddatni tanlang'))return;
    if(d.o_due<today())return toast("Muddat o'tib ketgan sana bo'lmasin");
    const pr=PR(+(d.o_pr||D.price[0].id)),zak=S.role==='zak'?u.id:+(d.o_zak||kind('zak')[0].id),units=Math.max(1,Math.round(num(d.o_units)||teethCount(d.o_teeth)||1));
    const n={id:D.next++,zak,pr:pr.id,patient:(d.o_pat||'').trim(),teeth:d.o_teeth.trim(),units,color:(d.o_color||'').trim(),due:d.o_due,note:(d.o_note||'').trim(),files:S.files.o||[],created:today(),del:false,
      sum:Math.round(units*pr.price*(1-(P(zak)?.disc||0)/100)),stages:pr.st.map(([p,rate])=>({p,rate,s:null,st:'wait',at:null})),chat:[],seen:{}};
    D.orders.unshift(n);['o_teeth','o_color','o_due','o_note','o_pat','o_units'].forEach(k=>delete d[k]);S.files.o=[];save();toast('Naryad yuborildi');return go('order',n.id)}
  case 'take':{const s=o.stages[+t.dataset.i];if(!avail(o,+t.dataset.i))return toast("Bu bosqich endi bo'sh emas");s.s=u.id;s.st='work';save();toast('Bosqich qabul qilindi');return render()}
  case 'sdone':{const s=o.stages[+t.dataset.i];if(u.prof==='cad'&&!S.files.w?.[0]&&!s.file)return toast('Avval .stl modelni yuklang');
    s.st='done';s.at=today();s.fix='';if(S.files.w?.[0])s.file=S.files.w[0].n;if((d.mn||'').trim())o.chat.push({w:'tex',n:u.n,t:`${PSH[s.p]} tayyor: ${d.mn.trim()}`});
    S.files.w=null;delete d.mn;save();toast('Bosqich topshirildi');return go('jobs')}
  case 'sback':{const s=o.stages[+t.dataset.i],why=prompt('Qaytarish sababi');if(why===null)return;s.st='work';s.fix=why||'Tuzatish kerak';s.at=null;
    o.stages.slice(+t.dataset.i+1).forEach(x=>{if(x.st==='done'){x.st='wait';x.s=null;x.at=null}});save();toast('Bosqich qaytarildi');return render()}
  case 'accept':o.del=true;o.delAt=today();save();toast('Naryad qabul qilindi');return go('orders');
  case 'deliver':o.del=true;o.delAt=today();save();toast('Topshirildi deb belgilandi');return render();
  case 'fix':{if(!need('fx','Tuzatish sababini yozing'))return;const i=o.stages.length-1,s=o.stages[i];s.st='work';s.fix=d.fx.trim();s.at=null;o.chat.push({w:'zak',n:u.n,t:'Tuzatish: '+d.fx.trim()});delete d.fx;save();toast('Tuzatishga qaytarildi');return go('orders')}
  case 'send':{const x=(d.cm||'').trim();if(!x)return;o.chat.push({w:S.role,n:u?.n,t:x});o.seen[S.role]=o.chat.length;d.cm='';save();return render()}
  case 'payorder':S.kt='in';S.kdate=today();go('kform');S.draft.k_p=String(o.zak);S.draft.k_o=String(o.id);S.draft.k_s=String((o.sum-(ix().byOrd[o.id]||0))/(D.kInK?1000:1));return render();
  case 'payclient':S.kt='in';S.kdate=today();go('kform');S.draft.k_p=String(S.pid);return render();
  case 'payadv':S.kt='adv';S.kdate=today();go('kform');S.draft.k_p=String(S.pid);return render();
  case 'kday':S.kdate=addDays(S.kdate,+t.dataset.k);S.draft.kdate=S.kdate;return render();
  case 'kadd':S.kt=t.dataset.k;return go('kform');
  case 'kdel':{if(!confirm("Yozuvni o'chirasizmi?"))return;const x=day(S.kdate);if(t.dataset.k==='bank')x.bank=0;else x[t.dataset.k].splice(+t.dataset.i,1);save();S.keep=$('.bd')?.scrollTop;return render()}
  case 'ksave':{const k=S.kt,s=amount('k_s');if(s<=0)return toast('Summani kiriting');const x=day(S.kdate);
    if(k==='in'){const pid=+d.k_p;if(!pid)return toast('Kim topshirganini tanlang');x.in.push(d.k_o?[pid,d.k_m||'n',s,+d.k_o]:[pid,d.k_m||'n',s])}
    if(k==='adv'){if(!+d.k_p)return toast('Kimga berilganini tanlang');x.adv.push([+d.k_p,s])}
    if(k==='exp'){if(!need('k_t','Nimaga sarflanganini yozing'))return;x.exp.push([d.k_t.trim(),s])}
    if(k==='oth'){x.oth.push([(d.k_t||'Boshqa kirim').trim(),d.k_m||'n',s])}
    if(k==='bank')x.bank=s;
    save();toast('Kassaga yozildi');return go('kassa')}
  case 'openday':S.kdate=t.dataset.k;return go('kassa');
  case 'openmonth':S.month=t.dataset.k;S.draft.month=S.month;return render();
  case 'csave':{const z=P(S.pid);z.disc=Math.min(100,Math.max(0,num(d.c_disc)));z.pct=z.pp=Math.min(1,Math.max(0,num(d.c_pct)/100));save();toast('Saqlandi');return render()}
  case 'addclient':{if(!need('z_name','Nomini kiriting'))return;const pct=Math.min(1,Math.max(0,num(d.z_pct)/100));
    const z={id:newId(),kind:'zak',n:d.z_name.trim(),sub:d.z_sub||'Shifokor',phone:d.z_phone||'',city:d.z_city||'',disc:Math.min(100,Math.max(0,num(d.z_disc))),pct,pp:pct,st:'ok'};
    D.people.push(z);['z_name','z_phone','z_city','z_disc','z_pct'].forEach(k=>delete d[k]);save();toast("Qo'shildi");return go('client',z.id)}
  case 'addstaff':{if(!need('s_name','Ismni kiriting'))return;const k=d.s_prof||'gips';
    const x={id:newId(),kind:k==='kas'?'kas':'tex',prof:k==='kas'?undefined:k,n:d.s_name.trim(),phone:d.s_phone||'',exp:d.s_exp||'',st:'ok'};
    D.people.push(x);['s_name','s_phone','s_exp'].forEach(k=>delete d[k]);save();toast("Xodim qo'shildi");return go('person',x.id)}
  case 'usr':{const x=P(S.pid);x.st=x.st==='blocked'?'ok':'blocked';save();return render()}
  case 'approve':case 'reject':{const x=P(S.pid);x.st=a==='approve'?'ok':'rejected';x.note=d.ar_note||'';d.ar_note='';save();toast(a==='approve'?'Tasdiqlandi':'Rad etildi');return go('staff')}
  case 'padd':{const id=Math.max(0,...D.price.map(p=>p.id))+1;D.price.push({id,n:'Yangi ish turi',unit:'birlik',price:0,st:[['gips',0]]});save();return go('pedit',id)}
  case 'paddst':{const p=PR(S.prid);p.st.push([d.p_add||'gips',0]);S.draft['p_r'+(p.st.length-1)]=0;return render()}
  case 'pdelst':{const p=PR(S.prid),i=+t.dataset.i;p.st.forEach((s,k)=>s[1]=num(d['p_r'+k]));p.st.splice(i,1);p.st.forEach((s,k)=>d['p_r'+k]=s[1]);delete d['p_r'+p.st.length];return render()}
  case 'psave':{const p=PR(S.prid);if(!need('p_n','Nomini kiriting'))return;if(!p.st.length)return toast("Kamida bitta bosqich qo'shing");
    p.n=d.p_n.trim();p.price=Math.max(0,Math.round(num(d.p_price)));p.unit=(d.p_unit||'birlik').trim();p.st.forEach((s,k)=>s[1]=Math.max(0,Math.round(num(d['p_r'+k]))));save();toast('Saqlandi');return go('price')}
  case 'pdel':if(!confirm("Ish turini o'chirasizmi?"))return;D.price=D.price.filter(p=>p.id!==S.prid);save();return go('price');
  case 'export':download(`dentbridge-baza-${today()}.json`,JSON.stringify(D));return toast('Zaxira fayl yuklab olindi');
  case 'restore':{const f=$('#fj');f.value='';return f.click()}
  case 'reset':if(!confirm("Barcha ma'lumot o'chib, demo baza tiklanadi. Davom etasizmi?"))return;D=seed();save();S.role='adm';toast('Demo baza tiklandi');return go('db');
  case 'pickx':{if(S.imp?.busy)return;const f=$('#fx');f.value='';return f.click()}
  case 'impgo':return importMerge();
  case 'savelang':{const x=document.querySelector('input[name=lang]:checked');D.lang=x?x.value:'uz';save();toast(D.lang==='uz'?'Saqlandi':'Hozircha faqat oʻzbekcha interfeys mavjud');return go(S.role==='adm'?'more':'set')}
  case 'contact':if(!need('c_msg','Xabar yozing'))return;d.c_msg='';toast('Yuborildi');return go('set');
  }
});
function saveTex(test){const d=S.draft,prof=d.t_prof||'gips';
  const x={kind:'tex',n:d.t_name.trim(),phone:d.t_phone||'',prof,exo:prof==='cad'?d.t_exo:undefined,exp:d.t_exp||'0',st:'pending',test:test||undefined,note:''};
  if(me())Object.assign(me(),x);else{x.id=newId();D.people.push(x);D.me.tex=x.id}
  save();toast('Ariza yuborildi');return go('regwait')}
async function readX(fs){
  S.imp={busy:true};render();
  try{await loadXLSX();let acc;
    for(const f of fs){const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellFormula:true,cellStyles:false,cellHTML:false});acc=KassaImport.parseWorkbook(wb,acc)}
    const r=KassaImport.finish(acc);r.files=fs.length;
    if(!Object.keys(r.days).length)r.err="Kunlik kassa varaqlari topilmadi. Varaq nomlari «2026 Avgust (4)» ko'rinishida bo'lishi kerak.";
    S.imp=r;
  }catch(err){S.imp={err:err.message||String(err)}}
  if(S.screen==='importx')render();
}
function importMerge(){const r=S.imp,rep=S.draft.imp_rep!==false,map={};
  for(const p of r.people){let x=D.people.find(y=>y.n.toLowerCase()===p.n.toLowerCase());
    if(!x){x={id:newId(),kind:'zak',sub:'Shifokor',n:p.n,phone:'',city:'',disc:0,pct:p.pct,pp:p.pp??p.pct,st:'ok',imported:true};D.people.push(x)}
    else if(x.kind==='zak'){x.pct=p.pct;x.pp=p.pp??p.pct}
    map[p.n]=x.id}
  const idOf=n=>map[n]||(map[n]=(()=>{const x={id:newId(),kind:'zak',sub:'Shifokor',n,pct:0.5,pp:0.5,st:'ok',imported:true};D.people.push(x);return x.id})());
  let added=0,kept=0;
  for(const [date,x] of Object.entries(r.days)){
    if(D.days[date]&&!rep){kept++;continue}
    D.days[date]={in:x.in.map(([n,m,s])=>[idOf(n),m,s]),adv:x.adv.map(([n,s])=>[idOf(n),s]),exp:x.exp.slice(),bank:x.bank||0,oth:x.oth.slice()};added++}
  if(!save())return;
  const last=Object.keys(r.days).sort().at(-1);if(last){S.month=last.slice(0,7);S.kdate=last}
  S.imp=null;toast(`${added} kun qo'shildi${kept?`, ${kept} kun saqlab qolindi`:''}`);return go('rep');
}
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fp'){const k=t.dataset.k,fs=[...t.files].map(f=>({n:f.name,s:f.size}));if(!fs.length)return;collect();
    if(k==='c'){const o=ord();o.chat.push({w:S.role,n:me()?.n,t:'Fayl: '+fs[0].n});o.seen[S.role]=o.chat.length;save()}
    else if(k==='o'||k==='t')S.files[k]=[...(S.files[k]||[]),...fs];else S.files[k]=fs;
    return render()}
  if(t.id==='fx'){const fs=[...t.files];if(fs.length)readX(fs);return}
  if(t.id==='fj'){const f=t.files[0];if(!f)return;f.text().then(txt=>{const x=JSON.parse(txt);if(!x||x.v!==3||!Array.isArray(x.people))throw new Error();
      if(!confirm("Joriy baza zaxira fayl bilan almashtiriladi. Davom etasizmi?"))return;D=x;save();toast('Baza tiklandi');go('db')}).catch(()=>toast("Fayl DentBridge zaxirasi emas"));return}
  if(t.dataset.act==='notif'){D.notif=t.checked;save();return}
  if(t.dataset.act==='kink'){D.kInK=t.checked;save();return}
  if(t.dataset.f==='kdate'&&t.value){S.kdate=t.value;collect();return render()}
  if(t.dataset.f==='month'&&t.value){S.month=t.value;collect();return render()}
  if(t.dataset.rr){collect();S.keep=$('.bd')?.scrollTop;render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='cq'){S.draft.cq=e.target.value;const pos=e.target.selectionStart;render();const q=$('#cq');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cm'){e.preventDefault();document.querySelector('[data-act=send]').click()}});
render();
</script>
